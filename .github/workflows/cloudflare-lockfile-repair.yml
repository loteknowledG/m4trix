name: Repair Cloudflare pnpm lockfile

on:
  push:
    branches: [cloudflare-lockfile-fix]
    paths:
      - .github/workflows/cloudflare-lockfile-repair.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Regenerate lockfile only (no lifecycle scripts)
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Verify lockfile is consistent
        run: pnpm install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Commit lockfile to isolated repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "fix: sync pnpm lockfile for Cloudflare build"
            git push origin HEAD:cloudflare-lockfile-fix
          fi
